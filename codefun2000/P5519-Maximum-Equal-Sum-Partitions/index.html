s:12px;min-height:110px}.descr{font-weight:600}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}.controls input{flex:1;min-width:120px;accent-color:var(--blue)}.code{background:#101b30;color:#dce7ff;padding:15px;border-radius:12px;overflow-x:auto;font:12px/1.75 Consolas,Monaco,monospace}.code-line{display:block;white-space:pre}.code-line.on{background:#294d88;outline:3px solid #294d88;border-radius:2px}.explain{color:var(--muted);font-size:12px}.error{color:#b91c1c}.done{color:var(--green)}@media(max-width:600px){.shell{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:19px}.chip{min-width:45px;padding:6px}.wrap{margin:8px auto}}

</style></head><body><main class="wrap"><div class="shell"><h1>P5519 · 等和连续段最多划分</h1><p>前缀和 + 枚举分段数：逐行观察 k、target、need、count 的变化</p>
<div class="line"><label for="arr"><b>数组</b></label><input id="arr" class="input" value="1 2 3 3 3" aria-label="输入数组，用空格分隔"><button id="apply" class="primary">开始演示</button></div>
<div class="line" style="margin-top:9px"><button data-example="1 2 3 3 3">普通样例</button><button data-example="-3 -4 5 -4 3">负数样例</button><button data-example="1 -1 2 -2 3 -3">总和为 0</button><button data-example="10 10 10 10">全部单元素段</button></div><div id="error" class="error" role="alert"></div>
<div class="section"><div class="heading">数组 arr <span class="explain">（绿色 = 已找到分块边界，蓝色 = 当前扫描位置）</span></div><div id="array" class="chips"></div></div>
<div class="section"><div class="heading">前缀和 presum</div><div id="prefix" class="chips"></div></div>
<div class="section"><div class="heading">候选分段数 block <span class="explain">（按从大到小尝试）</span></div><div id="blocks" class="chips"></div></div>
<div class="section"><div class="heading">当前变量</div><div class="stats" id="stats"></div></div>
<div class="section"><div class="heading">当前步骤 <span id="progressText" class="explain"></span></div><div class="panel"><div id="desc" class="descr"></div><div id="detail" class="explain" style="margin-top:7px"></div></div><div class="controls"><button id="first">⟲ 重置</button><button id="prev">← 上一步</button><button id="next" class="primary">下一步 →</button><button id="auto">▶ 自动播放</button><input type="range" id="seek" min="0" max="0" value="0" aria-label="执行进度"></div></div>
<div class="section"><div class="heading">Java 核心代码 <span class="explain">（蓝色高亮表示当前逻辑）</span></div><div class="code" id="code"></div></div><p class="explain" style="margin-top:14px">此演示沿用原始算法思路。为了避免整数溢出，示例使用 Java long；总和为 0 时单独处理。枚举段数 1 到 n 的版本最坏时间复杂度 O(n²)。</p></div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let steps=[],data=null,pos=0,timer=null;
const source=[['prefix','for (int i = 0; i < n; i++) {'],['prefix','    presum[i + 1] = presum[i] + arr[i];'],['prefix','}'],['sum','long sum = presum[n];'],['zero','if (sum == 0) { /* 统计前缀和为0的位置 */ }'],['block','for (int i = 1; i <= n; i++) {'],['block','    if (sum % i == 0) block.add(i);'],['block','}'],['candidate','for (int i = block.size() - 1; i >= 0; i--) {'],['candidate','    int k = block.get(i);'],['candidate','    long target = sum / k;'],['candidate','    int count = 0; long need = target;'],['scan','    for (int j = 1; j <= n; j++) {'],['scan','        if (presum[j] == need) {'],['scan','            count++; need += target;'],['scan','        }'],['done','        if (count == k) { System.out.println(k); return; }'],['scan','    }'],['candidate','}']];
function stop(){if(timer){clearInterval(timer);timer=null;}$('auto').textContent='▶ 自动播放';}
function compute(){stop();const tokens=$('arr').value.trim().split(/[\s,，]+/).filter(Boolean);if(!tokens.length||tokens.length>40||tokens.some(v=>!/^[-+]?\d+$/.test(v)||!Number.isSafeInteger(Number(v))))throw Error('请输入 1～40 个整数（空格或逗号分隔）。');
const arr=tokens.map(Number),n=arr.length,pre=[0];for(const v of arr){const s=pre[pre.length-1]+v;if(!Number.isSafeInteger(s))throw Error('前缀和过大，请输入更小的数值。');pre.push(s);}const sum=pre[n],block=[];steps=[];
const add=(kind,desc,other={})=>steps.push({kind,desc,...other});add('input',`读取 ${n} 个整数。`);
for(let j=1;j<=n;j++)add('prefix',`presum[${j}] = ${pre[j-1]} + (${arr[j-1]}) = ${pre[j]}`,{j});add('sum',`sum = presum[${n}] = ${sum}`);
if(sum===0){let count=0,cuts=[];add('zero','总和为 0，所有合法段的和必须等于 0。');for(let j=1;j<=n;j++){if(pre[j]===0){count++;cuts.push(j);}add('zero',`检查 presum[${j}] = ${pre[j]}：${pre[j]===0?'找到一段，count + 1':'继续查找'}`,{j,count,cuts:[...cuts]});}add('done',`得到答案 ${count}。`,{count,cuts,answer:count});}
else{for(let k=1;k<=n;k++)if(sum%k===0)block.push(k);add('block',`枚举得到候选分段数：${block.join('、')}。`);let ok=false;
for(let bi=block.length-1;bi>=0&&!ok;bi--){const k=block[bi],target=sum/k;let need=target,count=0,cuts=[];add('candidate',`尝试 k = ${k}，每段和 target = ${sum} / ${k} = ${target}。`,{k,target,need,count,cuts:[]});for(let j=1;j<=n;j++){const old=need,match=pre[j]===need;if(match){count++;need+=target;cuts.push(j);}add('scan',`presum[${j}] = ${pre[j]} ${match?'等于':'不等于'} need = ${old}${match?`；count 变为 ${count}，need 变为 ${need}`:''}。`,{k,target,need,count,j,cuts:[...cuts],match});if(count===k){ok=true;add('done',`成功分为 ${k} 段，输出 ${k}。`,{k,target,need,count,j,cuts:[...cuts],answer:k});break;}}if(!ok)add('candidate',`k = ${k} 不可行，换更小的段数。`,{k,target,count,need,cuts:[...cuts]});}}
data={arr,n,pre,sum,block};pos=0;}
function chip(v,sub,cl){const e=document.createElement('div');e.className='chip '+cl;e.innerHTML='<strong></strong><small></small>';e.children[0].textContent=v;e.children[1].textContent=sub;return e;}
function paint(){if(!data)return;const s=steps[pos],{arr,pre,block,sum}=data;for(const id of ['array','prefix','blocks'])$(id).replaceChildren();arr.forEach((v,i)=>$('array').append(chip(v,'a['+i+']',[(s.cuts||[]).includes(i+1)?'cut':'',s.j===i+1?'active':''].join(' '))));pre.forEach((v,i)=>$('prefix').append(chip(v,'pre['+i+']',[(s.cuts||[]).includes(i)?'cut':'',s.j===i?'active':''].join(' '))));if(sum===0)$('blocks').textContent='sum 为 0，直接统计前缀和为 0 的位置';else [...block].reverse().forEach(k=>$('blocks').append(chip(k,'候选 k',s.k===k?'active':'')));
$('stats').innerHTML='';[['sum',sum],['k',s.k??'—'],['target',s.target??'—'],['need',s.need??'—'],['count',s.count??0],['j',s.j??'—'],['n',data.n],['结果',s.answer??'待求']].forEach(([name,v])=>{const x=document.createElement('div');x.className='stat';const label=document.createElement('small');label.textContent=name;const b=document.createElement('b');b.textContent=v;x.append(label,b);$('stats').append(x);});$('desc').textContent=s.desc;$('detail').textContent=s.kind==='scan'?'绿色边界表示已找到的分块终点。':s.kind==='done'?'算法结束。':'观察高亮位置与变量值。';$('progressText').textContent=`${pos+1} / ${steps.length}`;$('seek').max=steps.length-1;$('seek').value=pos;$('prev').disabled=pos===0;$('first').disabled=pos===0;$('next').disabled=pos===steps.length-1;
$('code').replaceChildren(...source.map(([kind,line])=>{const e=document.createElement('span');e.className='code-line'+(s.kind===kind?' on':'');e.textContent=line;return e;}));}
function reset(){try{compute();$('error').textContent='';paint()}catch(e){$('error').textContent=e.message;}}
$('apply').onclick=reset;$('arr').onkeydown=e=>{if(e.key==='Enter')reset()};document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{$('arr').value=b.dataset.example;reset()});$('prev').onclick=()=>{stop();pos=Math.max(0,pos-1);paint()};$('next').onclick=()=>{stop();pos=Math.min(steps.length-1,pos+1);paint()};$('first').onclick=()=>{stop();pos=0;paint()};$('seek').oninput=e=>{stop();pos=+e.target.value;paint()};$('auto').onclick=()=>{if(timer){stop();return;}if(pos>=steps.length-1)pos=0;$('auto').textContent='⏸ 暂停';timer=setInterval(()=>{pos=Math.min(pos+1,steps.length-1);paint();if(pos===steps.length-1)stop()},900)};reset();
})();
</script></body></html>
