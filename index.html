<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="算法题目的交互式可视化索引。">
  <title>算法可视化 · 题目索引</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101827;
      --panel: #182337;
      --line: #2b3a51;
      --text: #f3f6fc;
      --muted: #a4b1c5;
      --accent: #f5bd66;
      --blue: #a8c8ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 82% 0%, #233450 0, transparent 39rem),
        var(--bg);
      color: var(--text);
      font: 16px/1.65 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    a { color: inherit; }

    .page {
      width: min(100% - 40px, 1040px);
      margin: 0 auto;
      padding: 72px 0 42px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }

    h1 {
      margin: 15px 0 8px;
      font-size: clamp(36px, 7vw, 58px);
      letter-spacing: -.045em;
      line-height: 1.12;
    }

    .intro {
      max-width: 580px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 48px 0 16px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 18px;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      min-height: 230px;
      flex-direction: column;
      padding: 23px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(145deg, #1b2940, var(--panel) 72%);
      text-decoration: none;
      transition: border-color .18s ease, transform .18s ease, background .18s ease;
    }

    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      border-color: #7084a2;
      background: linear-gradient(145deg, #22334d, #19263a 72%);
    }

    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .number {
      color: var(--accent);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .06em;
    }

    .arrow { color: var(--blue); font-size: 20px; }

    .card h3 {
      margin: 19px 0 7px;
      font-size: 21px;
      line-height: 1.4;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
      padding-top: 21px;
    }

    .tag {
      padding: 3px 9px;
      border: 1px solid #35445c;
      border-radius: 999px;
      color: #c3d2e8;
      font-size: 12px;
    }

    footer {
      margin-top: 54px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 520px) {
      .page { width: min(100% - 28px, 1040px); padding-top: 48px; }
      .section-heading { margin-top: 36px; }
      .card { min-height: 210px; padding: 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">Algorithm Visualizations</div>
      <h1>算法题目索引</h1>
      <p class="intro">通过交互式演示观察算法步骤、变量变化与核心思路。</p>
    </header>

    <section aria-labelledby="problems-heading">
      <div class="section-heading">
        <h2 id="problems-heading">题目列表</h2>
        <span class="count">目前收录 2 题</span>
      </div>
      <div class="grid">
        <a class="card" href="./codefun2000/P5508-Odd-Even-Linked-List/">
          <div class="card-top">
            <span class="number">P5508</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </div>
          <h3>奇偶链表</h3>
          <p>交互追踪奇数链与偶数链的拆分、指针移动和最终拼接。</p>
          <div class="tags" aria-label="算法标签">
            <span class="tag">链表</span>
            <span class="tag">双指针</span>
            <span class="tag">交互演示</span>
          </div>
        </a>
        <a class="card" href="./codefun2000/P5519-Maximum-Equal-Sum-Partitions/">
          <div class="card-top">
            <span class="number">P5519</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </div>
          <h3>等和连续段最多划分</h3>
          <p>交互观察候选段数、目标段和与前缀和扫描过程。</p>
          <div class="tags" aria-label="算法标签">
            <span class="tag">前缀和</span>
            <span class="tag">枚举分段</span>
            <span class="tag">交互演示</span>
          </div>
        </a>
      </div>
    </section>

    <footer>每道题的卡片可打开对应的算法交互演示。</footer>
  </main>
</body>
</html>
